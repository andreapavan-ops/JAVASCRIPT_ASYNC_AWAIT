<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Statistiche</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { margin-bottom: 20px; }

        .progresso-container {
            background: #ecf0f1; border-radius: 10px; height: 30px;
            margin-bottom: 20px; overflow: hidden;
        }
        .progresso-barra {
            height: 100%; background: #27ae60; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 14px;
            transition: width 0.4s;
            width: 0%;
        }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .stat-card {
            background: white; border-radius: 10px; padding: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .stat-card h3 { font-size: 14px; color: #999; text-transform: uppercase; margin-bottom: 4px; }
        .stat-card .valore { font-size: 28px; font-weight: bold; color: #2c3e50; }
        .stat-card .dettaglio { font-size: 13px; color: #777; margin-top: 4px; }

        .nascosto { display: none; }
    </style>
</head>
<body>
    <h1>📊 Dashboard Statistiche</h1>

    <div class="progresso-container" id="progressoContainer">
        <div class="progresso-barra" id="progressoBarra">0/4</div>
    </div>

    <div class="stats-grid nascosto" id="dashboard"></div>

    <script src="script.js"></script>
</body>
</html>
