<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Foto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { margin-bottom: 15px; }

        .controlli {
            display: flex; gap: 10px; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap;
        }
        .controlli select, .controlli button {
            padding: 8px 14px; border: 2px solid #ddd;
            border-radius: 6px; font-size: 14px;
        }
        .controlli button {
            background: #3498db; color: white; border-color: #3498db; cursor: pointer;
        }
        .controlli button:disabled { opacity: 0.5; cursor: not-allowed; }

        .griglia {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px; margin-bottom: 20px;
        }
        .foto {
            background: white; border-radius: 8px; overflow: hidden;
            cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .foto:hover { transform: scale(1.03); }
        .foto img { width: 100%; display: block; }
        .foto .titolo {
            padding: 6px 8px; font-size: 11px; color: #666;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .stato { text-align: center; padding: 20px; color: #999; }

        /* Modal */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex;
            align-items: center; justify-content: center; z-index: 100;
            cursor: pointer;
        }
        .overlay img { max-width: 90%; max-height: 90%; border-radius: 8px; }

        .nascosto { display: none; }
    </style>
</head>
<body>
    <h1>📸 Galleria Foto</h1>
    <div class="controlli">
        <select id="albumSelect">
            <option value="">Tutti gli album</option>
        </select>
        <button id="btnCarica">Carica altre 20</button>
    </div>
    <div class="griglia" id="griglia"></div>
    <div class="stato" id="stato"></div>

    <script src="script.js"></script>
</body>
</html>
