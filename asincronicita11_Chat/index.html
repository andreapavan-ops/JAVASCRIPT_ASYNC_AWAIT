<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Simulata</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #ece5dd; height: 100vh; display: flex; flex-direction: column; }

        .header {
            background: #075e54; color: white; padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h2 { font-size: 18px; }
        .header button {
            background: #c0392b; color: white; border: none;
            padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }

        .chat-container {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 6px;
        }

        .messaggio {
            max-width: 75%; padding: 8px 12px; border-radius: 10px;
            font-size: 14px; position: relative; word-wrap: break-word;
        }
        .messaggio .orario {
            font-size: 10px; color: #999; margin-top: 3px; text-align: right;
        }
        .utente {
            background: #dcf8c6; align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot {
            background: white; align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .typing {
            align-self: flex-start; background: white;
            padding: 10px 16px; border-radius: 10px; font-size: 14px; color: #999;
        }
        .typing .pallini span {
            display: inline-block; width: 7px; height: 7px;
            background: #999; border-radius: 50%; margin: 0 2px;
            animation: bounce 1.4s infinite;
        }
        .typing .pallini span:nth-child(2) { animation-delay: 0.2s; }
        .typing .pallini span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-area {
            display: flex; gap: 8px; padding: 10px 15px;
            background: #f0f0f0;
        }
        .input-area input {
            flex: 1; padding: 10px 14px; border: none;
            border-radius: 20px; font-size: 14px;
        }
        .input-area button {
            background: #075e54; color: white; border: none;
            padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 14px;
        }
        .input-area button:disabled { opacity: 0.5; }

        .nascosto { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h2>💬 ChatBot</h2>
        <button id="btnCancella">🗑️ Cancella chat</button>
    </div>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <input type="text" id="inputMsg" placeholder="Scrivi un messaggio...">
        <button id="btnInvia">Invia</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
