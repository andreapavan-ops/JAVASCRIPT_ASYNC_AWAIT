<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggregatore Notizie</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { margin-bottom: 15px; }

        /* Barra progresso */
        .progresso-container {
            background: #ecf0f1; border-radius: 10px; height: 26px;
            margin-bottom: 20px; overflow: hidden;
        }
        .progresso-barra {
            height: 100%; background: #3498db; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 12px;
            transition: width 0.4s; width: 0%;
        }

        /* Controlli */
        .controlli {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-bottom: 10px; align-items: center;
        }
        .controlli input[type="text"] {
            padding: 8px 14px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 14px; flex: 1; min-width: 200px;
        }
        .controlli select, .controlli button {
            padding: 8px 14px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 13px; background: white;
        }
        .controlli button { cursor: pointer; background: #3498db; color: white; border-color: #3498db; }

        .filtri-fonte { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
        .filtri-fonte label { font-size: 14px; cursor: pointer; }

        /* Statistiche */
        .statistiche {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;
        }
        .stat-badge {
            background: white; padding: 6px 14px; border-radius: 20px;
            font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        /* Refresh singola fonte */
        .refresh-fonti { display: flex; gap: 8px; margin-bottom: 20px; }
        .refresh-fonti button {
            padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 12px; cursor: pointer; background: white;
        }

        /* Feed */
        .feed-item {
            background: white; padding: 14px 18px; border-radius: 10px;
            margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            cursor: pointer; transition: background 0.2s;
            border-left: 4px solid #ddd;
        }
        .feed-item:hover { background: #fafafa; }
        .feed-item.letto { background: #f0f0f0; opacity: 0.7; }
        .feed-item.fonte-blog { border-left-color: #e74c3c; }
        .feed-item.fonte-social { border-left-color: #3498db; }
        .feed-item.fonte-news { border-left-color: #f39c12; }
        .feed-item .header-item { display: flex; justify-content: space-between; align-items: center; }
        .feed-item .badge {
            font-size: 11px; padding: 2px 8px; border-radius: 10px;
            background: #eee; font-weight: bold;
        }
        .feed-item h3 { font-size: 15px; color: #2c3e50; margin: 4px 0; }
        .feed-item p { font-size: 13px; color: #777; line-height: 1.4; }

        .nascosto { display: none; }
    </style>
</head>
<body>
    <h1>📰 Aggregatore Notizie</h1>

    <div class="progresso-container" id="progressoContainer">
        <div class="progresso-barra" id="progressoBarra">0%</div>
    </div>

    <div id="contenuto" class="nascosto">
        <div class="controlli">
            <input type="text" id="ricerca" placeholder="Cerca nel feed...">
            <select id="ordinamento">
                <option value="casuale">Ordine casuale</option>
                <option value="fonte">Per fonte</option>
                <option value="titolo">Per titolo (A-Z)</option>
                <option value="nonLetti">Non letti prima</option>
            </select>
        </div>

        <div class="filtri-fonte">
            <label><input type="checkbox" value="blog" checked> 📝 Blog</label>
            <label><input type="checkbox" value="social" checked> 💬 Social</label>
            <label><input type="checkbox" value="news" checked> 📰 News</label>
        </div>

        <div class="refresh-fonti">
            <button onclick="refreshFonte('blog')">🔄 Refresh Blog</button>
            <button onclick="refreshFonte('social')">🔄 Refresh Social</button>
            <button onclick="refreshFonte('news')">🔄 Refresh News</button>
        </div>

        <div class="statistiche" id="statistiche"></div>
        <div id="feed"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
