<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utenti → Post → Commenti</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { margin-bottom: 10px; }

        .breadcrumb {
            background: white; padding: 12px 16px; border-radius: 8px;
            margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            font-size: 14px; color: #666;
        }
        .breadcrumb span {
            cursor: pointer; color: #3498db; text-decoration: underline;
        }
        .breadcrumb span:hover { color: #2980b9; }
        .breadcrumb .attivo { color: #333; cursor: default; text-decoration: none; font-weight: bold; }

        .lista-item {
            background: white; padding: 12px 16px; border-radius: 8px;
            margin-bottom: 8px; cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            transition: background 0.2s;
        }
        .lista-item:hover { background: #eaf2f8; }
        .lista-item h3 { font-size: 16px; color: #2c3e50; }
        .lista-item p { font-size: 13px; color: #777; margin-top: 4px; }

        .commento {
            background: white; padding: 14px 16px; border-radius: 8px;
            margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-left: 4px solid #3498db;
        }
        .commento .autore { font-weight: bold; color: #2c3e50; font-size: 14px; }
        .commento .email { font-size: 12px; color: #999; }
        .commento .corpo { margin-top: 6px; font-size: 14px; color: #555; }

        .caricamento { text-align: center; padding: 30px; color: #999; font-size: 18px; }
        .errore { background: #ffe0e0; color: #c0392b; padding: 15px; border-radius: 8px; }

        .nascosto { display: none; }
    </style>
</head>
<body>
    <h1>📂 Utenti → Post → Commenti</h1>
    <div class="breadcrumb" id="breadcrumb">📍 Utenti</div>

    <div id="vista-utenti"></div>
    <div id="vista-post" class="nascosto"></div>
    <div id="vista-commenti" class="nascosto"></div>

    <script src="script.js"></script>
</body>
</html>
